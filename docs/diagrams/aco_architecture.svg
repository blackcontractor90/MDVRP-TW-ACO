<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="620" viewBox="0 0 1070 620" role="img" aria-labelledby="title desc">
<title id="title">ACO MDVRPTW hybrid search architecture</title><desc id="desc">ACO MDVRPTW hybrid search architecture</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".28"/></filter>
