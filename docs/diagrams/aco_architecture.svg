<rect width="1070" height="620" rx="22" fill="#0b1220"/>
<text x="42" y="42" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="800" text-anchor="start">ACO · MDVRPTW</text><text x="42" y="67" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13px" font-weight="500" text-anchor="start">Hybrid search architecture used by the current implementation</text><rect x="40" y="105" width="205" height="82" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="40" y="105" width="5" height="82" rx="3" fill="#a78bfa"/><text x="62" y="135" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">INSTANCE</text><text x="62" y="160" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">customers · depots</text><text x="62" y="180" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">time windows · demand</text><rect x="295" y="105" width="225" height="82" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="295" y="105" width="5" height="82" rx="3" fill="#38d6c5"/><text x="317" y="135" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">SOLUTION CONSTRUCTION</text><text x="317" y="160" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">pheromone × heuristic</text><text x="317" y="180" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">q0-guided selection</text><rect x="570" y="105" width="205" height="82" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="570" y="105" width="5" height="82" rx="3" fill="#f6b94a"/><text x="592" y="135" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">LOCAL SEARCH</text><text x="592" y="160" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">2-opt</text><text x="592" y="180" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">inter-route relocate</text><rect x="825" y="105" width="205" height="82" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="825" y="105" width="5" height="82" rx="3" fill="#a78bfa"/><text x="847" y="135" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">EVALUATION</text><text x="847" y="160" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">distance + penalty</text><text x="847" y="180" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">best solution update</text><line x1="245" y1="146" x2="295" y2="146" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><line x1="520" y1="146" x2="570" y2="146" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><line x1="775" y1="146" x2="825" y2="146" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="260" width="230" height="90" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="190" y="260" width="5" height="90" rx="3" fill="#fb7185"/><text x="212" y="290" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">SEARCH STATE</text><text x="212" y="315" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">best fitness</text><text x="212" y="335" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">stagnation counter</text><rect x="500" y="260" width="250" height="90" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="500" y="260" width="5" height="90" rx="3" fill="#38d6c5"/><text x="522" y="290" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">POPULATION STATE</text><text x="522" y="315" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">pairwise Hamming diversity</text><text x="522" y="335" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">normalized by chromosome length</text><rect x="830" y="260" width="230" height="90" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="830" y="260" width="5" height="90" rx="3" fill="#f6b94a"/><text x="852" y="290" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">ADAPT PARAMETERS</text><text x="852" y="315" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">α · β · ρ · q0</text><text x="852" y="335" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">exploration recovery</text><line x1="927" y1="187" x2="927" y2="260" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><line x1="420" y1="305" x2="500" y2="305" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><line x1="750" y1="305" x2="830" y2="305" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><path d="M945 350 C945 410 680 425 680 385" fill="none" stroke="#38d6c5" stroke-width="2.5" marker-end="url(#arrowTeal)"/><text x="680" y="425" fill="#38d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="700" text-anchor="middle">updated parameters feed the next ACO iteration</text><rect x="370" y="455" width="300" height="72" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="370" y="455" width="5" height="72" rx="3" fill="#a78bfa"/><text x="392" y="485" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">PHEROMONE UPDATE</text><text x="392" y="510" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">evaporation + solution reinforcement</text><path d="M680 385 L520 455" fill="none" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 527 C520 570 205 570 205 350" fill="none" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><text x="365" y="585" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="600" text-anchor="middle">repeat until maximum iterations</text>
</svg>