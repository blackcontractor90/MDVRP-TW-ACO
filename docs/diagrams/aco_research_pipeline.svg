<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="570" viewBox="0 0 1070 570" role="img" aria-labelledby="title desc">
<title id="title">ACO run to research artifact pipeline</title><desc id="desc">ACO run to research artifact pipeline</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9fb0c9"/></marker>
  <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#38d6c5"/></marker>
</defs>
<rect width="1070" height="570" rx="22" fill="#0b1220"/>
<text x="40" y="42" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="800" text-anchor="start">FROM RUN TO RESEARCH ARTIFACT</text><text x="40" y="67" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13px" font-weight="500" text-anchor="start">How one optimization run moves through the current repository</text><rect x="40" y="135" width="170" height="150" rx="18" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="40" y="135" width="170" height="8" rx="4" fill="#a78bfa"/><text x="125" y="172" fill="#a78bfa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="800" text-anchor="middle">RUN</text><text x="125" y="205" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="700" text-anchor="middle">MDVRPTWSolver</text><text x="125" y="232" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">launch ACO</text><text x="125" y="251" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">50 ants · 200 iterations</text><line x1="210" y1="210" x2="245" y2="210" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="135" width="170" height="150" rx="18" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="245" y="135" width="170" height="8" rx="4" fill="#38d6c5"/><text x="330" y="172" fill="#38d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="800" text-anchor="middle">TRACK</text><text x="330" y="205" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="700" text-anchor="middle">Convergence</text><text x="330" y="232" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">best distance</text><text x="330" y="251" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">iteration history</text><line x1="415" y1="210" x2="450" y2="210" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><rect x="450" y="135" width="170" height="150" rx="18" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="450" y="135" width="170" height="8" rx="4" fill="#f6b94a"/><text x="535" y="172" fill="#f6b94a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="800" text-anchor="middle">ANALYZE</text><text x="535" y="205" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="700" text-anchor="middle">SolutionMetrics</text><text x="535" y="232" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">fitness · distance</text><text x="535" y="251" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">penalty · feasibility</text><line x1="620" y1="210" x2="655" y2="210" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><rect x="655" y="135" width="170" height="150" rx="18" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="655" y="135" width="170" height="8" rx="4" fill="#fb7185"/><text x="740" y="172" fill="#fb7185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="800" text-anchor="middle">EXPORT</text><text x="740" y="205" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="700" text-anchor="middle">RouteExporter</text><text x="740" y="232" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">CSV summaries</text><text x="740" y="251" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">route plots</text><line x1="825" y1="210" x2="860" y2="210" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><rect x="860" y="135" width="170" height="150" rx="18" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="860" y="135" width="170" height="8" rx="4" fill="#a78bfa"/><text x="945" y="172" fill="#a78bfa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="800" text-anchor="middle">VIEW</text><text x="945" y="205" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="700" text-anchor="middle">MetricsChartViewer</text><text x="945" y="232" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">aggregate charts</text><text x="945" y="251" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">comparative analysis</text><rect x="145" y="360" width="780" height="115" rx="20" fill="#17243b" stroke="#40516d"/><text x="535" y="390" fill="#38d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13px" font-weight="800" text-anchor="middle">RESEARCH OUTPUTS</text><text x="275" y="425" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="800" text-anchor="middle">CSV</text><text x="275" y="448" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11px" font-weight="500" text-anchor="middle">route + overall summaries</text><text x="535" y="425" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="800" text-anchor="middle">PNG</text><text x="535" y="448" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11px" font-weight="500" text-anchor="middle">route layouts + scatter plots</text><text x="795" y="425" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16px" font-weight="800" text-anchor="middle">CHARTS</text><text x="795" y="448" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11px" font-weight="500" text-anchor="middle">metrics comparison views</text><text x="535" y="525" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">The repository separates optimization, measurement, export, and visualization so runs can be inspected rather than treated as a single black box.</text>
</svg>