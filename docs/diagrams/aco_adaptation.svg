<rect width="1070" height="660" rx="22" fill="#0b1220"/>
<text x="40" y="42" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22px" font-weight="800" text-anchor="start">ADAPTATION ENGINE</text><text x="40" y="67" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13px" font-weight="500" text-anchor="start">Two independent signals can trigger parameter adaptation</text><rect x="390" y="105" width="290" height="68" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="390" y="105" width="5" height="68" rx="3" fill="#38d6c5"/><text x="412" y="135" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">CURRENT ITERATION</text><text x="412" y="160" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">evaluate ants + update best</text><rect x="80" y="225" width="300" height="100" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="80" y="225" width="5" height="100" rx="3" fill="#fb7185"/><text x="102" y="255" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">STAGNATION SIGNAL</text><text x="102" y="280" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">best fitness unchanged</text><text x="102" y="300" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">for ≥ 20 iterations</text><rect x="690" y="225" width="300" height="100" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="690" y="225" width="5" height="100" rx="3" fill="#a78bfa"/><text x="712" y="255" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">DIVERSITY SIGNAL</text><text x="712" y="280" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">average normalized Hamming</text><text x="712" y="300" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">diversity below 0.15</text><rect x="365" y="390" width="340" height="105" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="365" y="390" width="5" height="105" rx="3" fill="#f6b94a"/><text x="387" y="420" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">ADAPT PARAMETERS</text><text x="387" y="445" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">q0 ↓   ·   ρ ↑   ·   α ↓</text><text x="387" y="465" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">β changes according to trigger</text><rect x="395" y="545" width="280" height="62" rx="16" fill="#111b2e" stroke="#40516d" stroke-width="1.5" filter="url(#shadow)"/><rect x="395" y="545" width="5" height="62" rx="3" fill="#38d6c5"/><text x="417" y="575" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17px" font-weight="700" text-anchor="start">NEXT SEARCH PHASE</text><text x="417" y="600" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="start">exploration pressure increased</text><line x1="535" y1="173" x2="230" y2="225" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><line x1="535" y1="173" x2="840" y2="225" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><line x1="230" y1="325" x2="450" y2="390" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><line x1="840" y1="325" x2="620" y2="390" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><line x1="535" y1="495" x2="535" y2="545" stroke="#9fb0c9" stroke-width="2" marker-end="url(#arrow)"/><text x="535" y="375" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="800" text-anchor="middle">OR</text><text x="535" y="635" fill="#9fb0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" font-weight="500" text-anchor="middle">Current source: stagnation limit = 20 · diversity threshold = 0.15</text>
