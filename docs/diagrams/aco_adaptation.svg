<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="660" viewBox="0 0 1070 660" role="img" aria-labelledby="title desc">
<title id="title">ACO adaptive parameter decision flow</title><desc id="desc">ACO adaptive parameter decision flow</desc>
